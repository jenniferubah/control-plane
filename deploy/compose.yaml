# DCM platform stack: control-plane monolith, optional UI and service providers.
#
# Image version: defaults to :main. Pin with CONTROL_PLANE_VERSION in .env.
# Local dev: `make compose-up` builds control-plane from the repo Containerfile.
#
# Credentials: set POSTGRES_USER and POSTGRES_PASSWORD in the environment or in
# a .env file (see deploy/.env.example). Defaults are for local dev only.

x-db-common: &db-common
  DB_TYPE: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${POSTGRES_USER:-admin}
  DB_PASS: ${POSTGRES_PASSWORD:-adminpass}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-adminpass}

x-dcm-registration-url: &dcm-registration-url "http://control-plane:8080/api/v1alpha1"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /opt/keycloak/data/import && content=$$(cat /opt/keycloak/data/realm-template.json) && printf '%s' \"$${content//REPLACE_DCM_DEV_PASSWORD/$$DCM_DEV_USER_PASSWORD}\" > /opt/keycloak/data/import/realm-export.json && exec /opt/keycloak/bin/kc.sh start-dev --import-realm"
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: "http://keycloak:8080"
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      DCM_DEV_USER_PASSWORD: ${DCM_DEV_USER_PASSWORD:-admin}
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/realm-template.json:ro,z
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: docker.io/library/nats:2-alpine
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
    volumes:
      - nats_data:/data

  control-plane:
    build:
      context: ..
      dockerfile: Containerfile
    image: quay.io/dcm-project/control-plane:${CONTROL_PLANE_VERSION:-main}
    pull_policy: always
    environment:
      <<: *db-common
      BIND_ADDRESS: ":8080"
      DB_NAME: control-plane
      LOG_LEVEL: info
      NATS_URL: "nats://nats:4222"
      DCM_ADMIN_SUBJECT: ${DCM_ADMIN_SUBJECT:-56deb662-4820-5d83-b828-f4beb11a5fa7}
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-dcm-dev-proxy-secret}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      keycloak:
        condition: service_healthy

  dcm-ui:
    image: quay.io/dcm-project/dcm-ui:${DCM_UI_VERSION:-main}
    pull_policy: always
    ports:
      - "7007:7007"
    environment:
      APP_BASE_URL: http://localhost:7007
      DCM_API_URL: http://control-plane:8080
    depends_on:
      control-plane:
        condition: service_started

  environment-agent:
    profiles: ["environment-agent"]
    image: quay.io/dcm-project/environment-agent:${ENVIRONMENT_AGENT_VERSION:-main}
    pull_policy: always
    environment:
      AGENT_NAME: ${AGENT_NAME:-local-agent}
      AGENT_ENVIRONMENT: ${AGENT_ENVIRONMENT:-dev}
      AGENT_COST: ${AGENT_COST:-low}
      # Base URL only — the agent appends /api/v1alpha1/agents for registration.
      DCM_REGISTRATION_URL: http://control-plane:8080
      AGENT_MESSAGING_URL: nats://nats:4222
      AGENT_EMBEDDED_SPS: ${AGENT_EMBEDDED_SPS:-}
      SP_DEFAULT_KUBECONFIG: /kubeconfig
      SP_CONTAINER_NAMESPACE: ${SP_CONTAINER_NAMESPACE:-default}
      SP_K8S_EXTERNAL_SVC_TYPE: ${SP_K8S_EXTERNAL_SVC_TYPE:-NodePort}
      SP_VM_NAMESPACE: ${SP_VM_NAMESPACE:-default}
      SP_CLUSTER_NAMESPACE: ${SP_CLUSTER_NAMESPACE:-}
      SP_PULL_SECRET: ${SP_PULL_SECRET:-}
      SP_BASE_DOMAIN: ${SP_BASE_DOMAIN:-}
      SP_STORAGE_NAMESPACE: ${SP_STORAGE_NAMESPACE:-default}
      SP_K8S_DEFAULT_STORAGE_CLASS: ${SP_K8S_DEFAULT_STORAGE_CLASS:-}
      SP_K8S_DEFAULT_ACCESS_MODE: ${SP_K8S_DEFAULT_ACCESS_MODE:-ReadWriteOnce}
      AGENT_SP_PERSISTENCE_PATH: /app/data/registrations.json
    ports:
      - "${AGENT_PORT:-8081}:8080"
    volumes:
      - ${AGENT_KUBECONFIG_HOST:-~/.kube/config}:/kubeconfig:ro,z
      - environment_agent_data:/app/data
    depends_on:
      control-plane:
        condition: service_started
      nats:
        condition: service_started

volumes:
  postgres_data: {}
  nats_data: {}
  environment_agent_data: {}
